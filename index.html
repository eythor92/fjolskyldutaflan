const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='taflan_key_'+D.s.slice(0,8);
async function open(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.c));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
async function derive(u,p){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:D.n,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt'])}
(async()=>{let saved=null;try{saved=localStorage.getItem(K)}catch(e){}
 if(saved){try{const key=await crypto.subtle.importKey('raw',ub(saved),'AES-GCM',true,['decrypt']);await open(key);return}catch(e){try{localStorage.removeItem(K)}catch(_){}}}

 f.addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),er=document.getElementById('err');b.disabled=true;b.textContent='Augnablik…';er.textContent='';
  try{const key=await derive(document.getElementById('u').value,document.getElementById('p').value);
   const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
   await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.c));
   if(document.getElementById('r').checked){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}}
   await open(key)}catch(x){er.textContent='Rangt notandanafn eða lykilorð.';b.disabled=false;b.textContent='Skrá inn'}})})();
