const K='taflan_key_'+D.s.slice(0,8);
async function open(key){const fm=document.getElementById('f');if(fm)fm.remove();const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.c));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
async function derive(u,p){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveKey']);
